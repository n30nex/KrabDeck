name: Build Validation Matrix

"on":
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.env }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, krabdeck-pi5]
    strategy:
      fail-fast: false
      matrix:
        include:
          # KrabOS release, RF-off recovery, and RF-off diagnostics
          - env: KrabOS_TDeckPlus
          - env: KrabOS_TDeckPlus_recovery
          - env: KrabOS_TDeckPlus_debug
          # Canonical and feature variants
          - env: SigurdOS_TDeck
          - env: SigurdOS_TDeck_ble_validation
          - env: SigurdOS_TDeck_ble_agent
          - env: SigurdOS_TDeck_meshv2
          - env: SigurdOS_TDeck_trackball_debug
          # Debug variants (compile-only guards for debug-specific code paths)
          - env: SigurdOS_TDeck_debug
          - env: SigurdOS_TDeck_debug_869
          - env: SigurdOS_TDeck_debug_display
          - env: SigurdOS_TDeck_debug_mesh
          - env: SigurdOS_TDeck_debug_ui
          - env: SigurdOS_TDeck_debug_map
          - env: SigurdOS_TDeck_debug_diag
          # Telemetry and remote-test variants
          - env: SigurdOS_TDeck_telemetry
          - env: SigurdOS_TDeck_telemetry_diff
          - env: SigurdOS_TDeck_remote_test
          - env: SigurdOS_TDeck_remote_test_radio
          - env: SigurdOS_TDeck_remote_test_radio_meshv2
          # Host-protocol and hardware-validation compile targets
          - env: SigurdOS_TDeck_companion_usb
          - env: SigurdOS_TDeck_gps_validation
          - env: SigurdOS_TDeck_gps_validation_wifi
          # ESP32-only compile/link probe
          - env: SigurdOS_TDeck_esp32_components
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Check MeshCore lock pin
        run: python3 scripts/check_meshcore_pin.py
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.13"
      - name: Restore PlatformIO packages
        uses: ./.github/actions/cache-platformio
        with:
          dependency-hash: ${{ hashFiles('platformio.ini', 'lib/meshcore/library.json', 'ci/requirements-platformio.in', 'ci/requirements-platformio.txt', 'ci/platformio-packages.lock') }}
      - name: Install PlatformIO
        run: python -m pip install --require-hashes -r ci/requirements-platformio.txt
      - name: Build ${{ matrix.env }}
        id: firmware_build
        env:
          # Compile-only placeholders: no network or device interaction occurs in CI.
          SIGURDOS_GPS_VALIDATION_WIFI_SSID: ci-compile-only
          SIGURDOS_GPS_VALIDATION_WIFI_PASS: ci-not-a-secret
          SIGURDOS_GPS_VALIDATION_WIFI_HOST: 192.0.2.1
          SIGURDOS_GPS_VALIDATION_WIFI_TOKEN: ci-compile-token-0123456789abcdef
        run: |
          set -o pipefail
          if ! grep -Fqx '[env:${{ matrix.env }}]' platformio.ini; then
            case '${{ matrix.env }}' in
              KrabOS_*)
                echo 'skipped=true' >> "$GITHUB_OUTPUT"
                echo '${{ matrix.env }} is not present yet; workflow-only bootstrap skips it.'
                exit 0
                ;;
              *)
                echo 'Required PlatformIO environment is missing: ${{ matrix.env }}' >&2
                exit 1
                ;;
            esac
          fi
          echo 'skipped=false' >> "$GITHUB_OUTPUT"
          pio run -e ${{ matrix.env }} 2>&1 | tee "build-${{ matrix.env }}.log"
      - name: Enforce first-party warning budget for ${{ matrix.env }}
        if: >-
          steps.firmware_build.outputs.skipped != 'true' &&
          (matrix.env == 'SigurdOS_TDeck' || matrix.env == 'KrabOS_TDeckPlus')
        run: >-
          python scripts/check_first_party_warnings.py
          --log "build-${{ matrix.env }}.log"
          --baseline ci/first_party_warnings.json
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Verify resolved PlatformIO graph
        if: >-
          steps.firmware_build.outputs.skipped != 'true' &&
          (matrix.env == 'SigurdOS_TDeck' || matrix.env == 'KrabOS_TDeckPlus')
        run: python scripts/platformio_lock.py --check
      - name: Upload firmware artifacts for ${{ matrix.env }}
        if: steps.firmware_build.outputs.skipped != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware*.bin
          if-no-files-found: error
          retention-days: 7
