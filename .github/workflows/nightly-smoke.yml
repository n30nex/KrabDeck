name: Nightly Smoke Matrix

"on":
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Env smoke matrix
    runs-on: [self-hosted, Linux, ARM64, krabdeck-pi5]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Check MeshCore lock and remote pin
        run: python3 scripts/check_meshcore_pin.py --check-remote

      - name: Create isolated system-Python environment
        shell: bash
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
          python3 -m venv "$RUNNER_TEMP/platformio-venv"
          echo "$RUNNER_TEMP/platformio-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/platformio-venv/bin/python" --version

      - name: Restore PlatformIO packages
        uses: ./.github/actions/cache-platformio
        with:
          dependency-hash: ${{ hashFiles('platformio.ini', 'lib/meshcore/library.json', 'ci/requirements-platformio-pi.in', 'ci/requirements-platformio-pi.txt', 'ci/platformio-packages.lock') }}

      - name: Install PlatformIO
        run: python -m pip install --require-hashes -r ci/requirements-platformio-pi.txt

      - name: Resolve exact firmware packages
        run: pio pkg install -e SigurdOS_TDeck

      - name: Verify resolved PlatformIO graph
        run: python scripts/platformio_lock.py --check --environment SigurdOS_TDeck

      - name: Run smoke build matrix
        run: python scripts/smoke_build_matrix.py --profile roadmap
